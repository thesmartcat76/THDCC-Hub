<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THDCC Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; max-width: 960px; margin: 50px auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .admin-link { background-color: #007bff; color: white; padding: 6px 12px; text-decoration: none; border-radius: 3px; font-size: 0.8em; }
        .admin-link:hover { background-color: #0056b3; }
        .hidden { display: none; }

        /* Login */
        .login-panel { border: 2px solid #333; padding: 24px; border-radius: 8px; max-width: 400px; margin: 80px auto; }
        .login-panel input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .login-panel button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; font-size: 1em; }
        .login-panel button:hover { background-color: #0056b3; }

        /* Cards / sections */
        .profile-section { background: white; padding: 20px; margin-bottom: 24px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .profile-section > h2 { margin-top: 0; }

        /* Dashboard 3-column row */
        .dash-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        @media (max-width: 700px) { .dash-row { grid-template-columns: 1fr; } }

        .dash-card { background: white; padding: 16px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
        .dash-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .dash-card-header h3 { margin: 0; font-size: 1em; }
        .dash-card-header a.title-link { text-decoration: none; color: inherit; font-weight: bold; font-size: 1em; }
        .dash-card-header a.title-link:hover { color: #007bff; }

        .item-row { padding: 8px; border: 1px solid #e0e0e0; border-radius: 4px; background: #fbfbfb; margin-bottom: 6px; }
        .item-row strong { display: block; font-size: 0.95em; }
        .item-row .sub { color: #666; font-size: 0.85em; display: block; }

        .view-all-link { display: block; text-align: center; margin-top: auto; padding-top: 10px; font-size: 0.85em; color: #007bff; text-decoration: none; border-top: 1px solid #eee; }
        .view-all-link:hover { text-decoration: underline; }

        .edit-btn { background-color: #007bff; color: white; padding: 4px 8px; text-decoration: none; border-radius: 3px; font-size: 0.75em; white-space: nowrap; }
        .edit-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <!-- ── Login ─────────────────────────────────────────────────── -->
    <div id="loginPanel" class="login-panel">
        <h2 style="margin-top:0;">THDCC Member Login</h2>
        <input type="text" id="uidInput" placeholder="Enter your UID">
        <button onclick="loginMember()">Sign In</button>
        <p style="text-align:center; color:#666; font-size:0.9em; margin-top:15px;">
            Need access? <a href="members_edit.html">Admin page</a>
        </p>
    </div>

    <!-- ── Loading spinner ───────────────────────────────────────── -->
    <div id="loadingPanel" class="login-panel hidden" style="text-align:center;">
        <p style="font-size:1.2em; color:#555;">🔄 Signing you in…</p>
    </div>

    <!-- ── Authenticated view ────────────────────────────────────── -->
    <div id="memberView" class="hidden">

        <div class="header">
            <h1>THDCC Hub</h1>
            <button onclick="logoutMember()"
                    style="background:#6c757d;color:white;padding:10px 20px;border:none;cursor:pointer;border-radius:4px;">
                Logout
            </button>
        </div>

        <!-- Your Profile -->
        <div id="myProfile" class="profile-section hidden">
            <h2>Your Profile</h2>
            <p><strong>Name:</strong>   <span id="profileName"></span></p>
            <p><strong>UID:</strong>    <span id="profileUID"></span></p>
            <p><strong>Email:</strong>  <span id="profileEmail"></span></p>
            <p><strong>Phone:</strong>  <span id="profilePhone"></span></p>
            <p><strong>Role:</strong>   <span id="profileRole"></span></p>
            <p><strong>Joined:</strong> <span id="profileDate"></span></p>
            <p><strong>Bio:</strong>    <span id="profileDesc"></span></p>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="profile-section hidden">
            <h2>Dashboard</h2>
            <div class="dash-row">

                <!-- Sessions card -->
                <div class="dash-card">
                    <div class="dash-card-header">
                        <a href="sessions.html" class="title-link">📅 Sessions</a>
                        <a href="sessions_edit.html" class="edit-btn">Edit</a>
                    </div>
                    <div id="nearestSessionContainer">Loading…</div>
                    <a href="sessions.html" class="view-all-link">View all sessions →</a>
                </div>

                <!-- Projects card -->
                <div class="dash-card">
                    <div class="dash-card-header">
                        <a href="projects.html" class="title-link">🗂 My Projects</a>
                        <a href="projects_edit.html" class="edit-btn">Edit</a>
                    </div>
                    <div id="myProjectsContainer">Loading…</div>
                    <a href="projects.html" class="view-all-link">View all projects →</a>
                </div>

                <!-- Members card -->
                <div class="dash-card">
                    <div class="dash-card-header">
                        <a href="members.html" class="title-link">👥 Members</a>
                        <a href="members_edit.html" class="edit-btn">Edit</a>
                    </div>
                    <div id="allMembersContainer">Loading…</div>
                    <a href="members.html" class="view-all-link">View all members →</a>
                </div>

            </div>
        </div>

    </div><!-- /#memberView -->

    <script>
        const DASH_LIMIT = 3; // max items shown per card
        let currentUID = null;

        /* ── Auth ──────────────────────────────────────────────── */
        function loginMember() {
            const uid = document.getElementById('uidInput').value.trim();
            if (!uid) { alert('Please enter your UID'); return; }

            fetch('api.php?action=get&type=members')
                .then(r => r.json())
                .then(members => {
                    const member = members.find(m => m.uid === uid);
                    if (member) {
                        currentUID = uid;
                        sessionStorage.setItem('memberUID', uid);
                        showMemberView(member, members);
                    } else {
                        alert('UID not found. Please check and try again.');
                    }
                })
                .catch(err => { console.error(err); alert('Error signing in'); });
        }

        function logoutMember() {
            currentUID = null;
            sessionStorage.removeItem('memberUID');
            document.getElementById('uidInput').value = '';
            document.getElementById('loginPanel').classList.remove('hidden');
            document.getElementById('memberView').classList.add('hidden');
            document.getElementById('myProfile').classList.add('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }

        /* ── Show view after login ─────────────────────────────── */
        function showMemberView(member, members) {
            document.getElementById('loginPanel').classList.add('hidden');
            document.getElementById('loadingPanel').classList.add('hidden');
            document.getElementById('memberView').classList.remove('hidden');

            // Populate profile
            document.getElementById('myProfile').classList.remove('hidden');
            document.getElementById('profileName').textContent  = member.name;
            document.getElementById('profileUID').textContent   = member.uid;
            document.getElementById('profileEmail').textContent = member.email || 'N/A';
            document.getElementById('profilePhone').textContent = member.phone || 'N/A';
            document.getElementById('profileRole').textContent  = member.role  || 'N/A';
            document.getElementById('profileDate').textContent  = member.date  || 'N/A';
            document.getElementById('profileDesc').textContent  = member.desc  || 'N/A';

            loadDashboard(member, members);
        }

        /* ── Dashboard ─────────────────────────────────────────── */
        function loadDashboard(member, members) {
            // Show the dashboard section now that data is ready
            document.getElementById('dashboard').classList.remove('hidden');

            // 1. Fetch and render Sessions
            fetch('api.php?action=get&type=sessions')
                .then(r => r.json())
                .then(sessions => {
                    renderNearestSessions(sessions);
                })
                .catch(err => console.error("Session fetch error:", err));

            // 2. Fetch and render Projects
            fetch('api.php?action=get&type=projects')
                .then(r => r.json())
                .then(projects => {
                    renderProjectsForMember(projects, member);
                })
                .catch(err => console.error("Project fetch error:", err));

            // 3. Render members using the existing list from login
            renderAllMembers(members);
        }

        /* ── Rendering Helpers ─────────────────────────────────── */
        function renderNearestSessions(sessions) {
    const el = document.getElementById('nearestSessionContainer');
    if (!Array.isArray(sessions) || sessions.length === 0) {
        el.innerHTML = '<span class="sub">No sessions scheduled</span>'; return;
    }
    const now = new Date();
    const withDates = sessions.map(s => ({ ...s, _d: s.date ? new Date(s.date) : null }));
    const upcoming  = withDates.filter(s => s._d && s._d >= now).sort((a,b) => a._d - b._d);
    
    // Change DASH_LIMIT to 1 here to only show the single nearest session
    const toShow = upcoming.length > 0
        ? upcoming.slice(0, 1) 
        : withDates.filter(s => s._d).sort((a,b) => b._d - a._d).slice(0, 1);

    el.innerHTML = toShow.map(s => `
        <div class="item-row">
            <strong>${s.name || 'Untitled'}</strong>
            <span class="sub">${s.date || 'No date'}</span>
        </div>`).join('');
}

        function renderProjectsForMember(projects, member) {
            const el = document.getElementById('myProjectsContainer');
            if (!Array.isArray(projects) || projects.length === 0) {
                el.innerHTML = '<span class="sub">No projects yet</span>'; return;
            }
            const mine = projects.filter(p => {
                const m = p.members;
                if (Array.isArray(m))       return m.includes(member.uid) || m.includes(member.name);
                if (typeof m === 'string')  return m.includes(member.uid) || m.includes(member.name);
                return false;
            });
            if (mine.length === 0) {
                el.innerHTML = '<span class="sub">Not assigned to any projects</span>'; return;
            }
            el.innerHTML = mine.slice(0, DASH_LIMIT).map(p => `
                <div class="item-row">
                    <strong>${p.name || 'Untitled'}</strong>
                    <span class="sub">${p.date || ''}${p.deadline ? ' · Due: ' + p.deadline : ''}</span>
                    ${p.desc ? `<span class="sub">${p.desc}</span>` : ''}
                </div>`).join('');
        }

        function renderAllMembers(members) {
    const el = document.getElementById('allMembersContainer');
    if (!Array.isArray(members) || members.length === 0) {
        el.innerHTML = '<span class="sub">No members yet</span>'; 
        return;
    }
    
    el.innerHTML = members.slice(0, DASH_LIMIT).map(m => {
        const isMe = m.uid && m.uid === currentUID;
        // Logic: Only show the UID if isMe is true
        const uidDisplay = isMe ? ` <span style="color:#999;font-size:0.8em;">(${m.uid})</span>` : '';
        const meTag = isMe ? ' <span style="color:#28a745;font-size:0.8em;">(you)</span>' : '';

        return `
        <div class="item-row">
            <strong>${m.name}${uidDisplay}${meTag}</strong>
            ${m.role  ? `<span class="sub" style="color:#007bff;">${m.role}</span>` : ''}
            ${m.email ? `<span class="sub">📧 ${m.email}</span>` : ''}
        </div>`;
    }).join('');
}
        /* ── Auto-login from session ───────────────────────────── */
        window.addEventListener('load', () => {
            const savedUID = sessionStorage.getItem('memberUID');
            if (!savedUID) return;

            document.getElementById('loginPanel').classList.add('hidden');
            document.getElementById('loadingPanel').classList.remove('hidden');

            fetch('api.php?action=get&type=members')
                .then(r => r.json())
                .then(members => {
                    const member = members.find(m => m.uid === savedUID);
                    if (member) {
                        currentUID = savedUID;
                        showMemberView(member, members);
                    } else {
                        sessionStorage.removeItem('memberUID');
                        document.getElementById('loadingPanel').classList.add('hidden');
                        document.getElementById('loginPanel').classList.remove('hidden');
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loadingPanel').classList.add('hidden');
                    document.getElementById('loginPanel').classList.remove('hidden');
                });
        });
    </script>
</body>
</html>
