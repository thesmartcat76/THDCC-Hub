<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Member Editor</title>
    <style>
        :root {
            --bg: #0b0b0c;
            --panel: #111214;
            --muted: #9aa6b2;
            --card: #121215;
            --accent: #2563eb;
            --accent-hover: #1e4fd8;
            --border: #222428;
            --text: #e6eef2;
            --input-bg: #0f1112;
        }

        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; background: var(--bg); color: var(--text); }
        a { color: #9ecbff; }
        .login-panel, .admin-panel { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-radius: 8px; color: var(--text); }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
        label { color: var(--muted); display:block; margin-top:8px; }
        button { padding: 10px 20px; background-color: var(--accent); color: white; border: none; cursor: pointer; border-radius: 6px; }
        button:hover { background-color: var(--accent-hover); }
        .member-item { background: var(--card); padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid rgba(255,255,255,0.02); }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Admin Member Editor</h1>
    
    <div id="loginPanel" class="login-panel">
        <h2>Enter Password</h2>
        <input type="password" id="passwordInput" placeholder="Password">
        <button onclick="checkPassword()">Login</button>
    </div>

    <div id="adminPanel" class="admin-panel hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">Admin Panel</h2>
            <div>
                <a href="members.html" style="background-color: #6c757d; color: white; padding: 10px 20px; text-decoration: none; border-radius: 3px; margin-right: 10px; display: inline-block;">← Back to Members</a>
                <button onclick="logout()" style="float: right;">Logout</button>
            </div>
        </div>
        <input type="text" id="memberName" placeholder="Full Name" required>
        <input type="text" id="memberUID" placeholder="UID / ID Number">
        <input type="email" id="memberEmail" placeholder="Email">
        <input type="tel" id="memberPhone" placeholder="Phone Number">
        <input type="text" id="memberRole" placeholder="Role/Position">
        <input type="date" id="memberJoinDate" placeholder="Join Date">
        <textarea id="memberDesc" placeholder="Bio / Description"></textarea>
        <button onclick="addMember()">Add Member</button>

        <h2>Members</h2>
        <div id="membersList"></div>

        <h2>Export/Import</h2>
        <div style="margin-bottom: 15px;">
            <label for="fileUpload" style="display: block; margin-bottom: 10px;">Upload JSON File:</label>
            <input type="file" id="fileUpload" accept=".json" style="margin-bottom: 10px;">
            <button onclick="uploadJSON()">Upload Members</button>
        </div>
        <button onclick="downloadJSON()">Download JSON</button>
        <button onclick="clearAll()">Clear All</button>
    </div>

    <script>
        const ADMIN_PASSWORD = 'THDCC2026';
let members = [];
let editIndex = -1; // -1 means adding new, otherwise index of item being edited

function checkPassword() {
    const pwd = document.getElementById('passwordInput').value;
    if (pwd === ADMIN_PASSWORD) {
        document.getElementById('loginPanel').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadMembers();
    } else {
        alert('Invalid password');
    }
}

function loadMembers() {
    fetch('api.php?action=get&type=members')
        .then(res => res.json())
        .then(data => {
            members = data;
            renderMembers();
        });
}

function addMember() {
    const name = document.getElementById('memberName').value;
    const uid = document.getElementById('memberUID').value;
    const email = document.getElementById('memberEmail').value;
    const phone = document.getElementById('memberPhone').value;
    const role = document.getElementById('memberRole').value;
    const joinDate = document.getElementById('memberJoinDate').value;
    const desc = document.getElementById('memberDesc').value;

    if (!name) return alert('Member name is required');

    const memberData = { name, uid, email, phone, role, date: joinDate, desc };

    if (editIndex > -1) {
        // UPDATE MODE
        members[editIndex] = memberData;
        fetch('api.php?action=upload&type=members', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessions: members }) // api.php uses 'sessions' key for all uploads
        })
        .then(res => res.json())
        .then(data => {
            members = data.items;
            finishUI();
        });
    } else {
        // ADD MODE
        fetch('api.php?action=add&type=members', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(memberData)
        })
        .then(res => res.json())
        .then(data => {
            members = data.items;
            finishUI();
        });
    }
}

function startEdit(index) {
    editIndex = index;
    const m = members[index];
    document.getElementById('memberName').value = m.name;
    document.getElementById('memberUID').value = m.uid || '';
    document.getElementById('memberEmail').value = m.email || '';
    document.getElementById('memberPhone').value = m.phone || '';
    document.getElementById('memberRole').value = m.role || '';
    document.getElementById('memberJoinDate').value = m.date || '';
    document.getElementById('memberDesc').value = m.desc || '';
    
    document.querySelector('button[onclick="addMember()"]').textContent = "Update Member";
    window.scrollTo(0, 0);
}

function finishUI() {
    renderMembers();
    resetForm();
}

function resetForm() {
    editIndex = -1;
    document.querySelectorAll('#adminPanel input, #adminPanel textarea').forEach(i => i.value = '');
    document.querySelector('button[onclick="addMember()"]').textContent = "Add Member";
}

function renderMembers() {
    const list = document.getElementById('membersList');
    list.innerHTML = members.map((m, i) => `
        <div class="member-item">
            <strong>${m.name}</strong> ${m.role ? `(${m.role})` : ''}
            <div style="margin-top:10px;">
                <button onclick="startEdit(${i})" style="background:#28a745;">Edit</button>
                <button onclick="deleteMember(${i})" style="background:#dc3545;">Delete</button>
            </div>
        </div>
    `).join('');
}

function deleteMember(index) {
    if (!confirm('Delete this member?')) return;
    fetch('api.php?action=delete&type=members', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ index })
    })
    .then(res => res.json())
    .then(data => { members = data.items; renderMembers(); })
    .catch(err => console.error('Error deleting member:', err));
}

function logout() {
    document.getElementById('loginPanel').classList.remove('hidden');
    document.getElementById('adminPanel').classList.add('hidden');
    document.getElementById('passwordInput').value = '';
}

function downloadJSON() {
    const blob = new Blob([JSON.stringify(members, null, 2)], { type: 'application/json' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'members.json' });
    a.click();
}

function uploadJSON() {
    const file = document.getElementById('fileUpload').files[0];
    if (!file) { alert('Please select a JSON file'); return; }
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = JSON.parse(e.target.result);
            if (!Array.isArray(data)) { alert('File must contain an array of members.'); return; }
            if (!data.every(m => m.name)) { alert('Each member must have a name.'); return; }
            fetch('api.php?action=upload&type=members', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessions: data })
            })
            .then(res => res.json())
            .then(d => { members = d.items; renderMembers(); document.getElementById('fileUpload').value = ''; alert('Members uploaded!'); })
            .catch(err => { console.error(err); alert('Upload error'); });
        } catch { alert('Invalid JSON file'); }
    };
    reader.readAsText(file);
}

function clearAll() {
    if (!confirm('Clear ALL members? This cannot be undone.')) return;
    fetch('api.php?action=clear&type=members', { method: 'POST' })
        .then(res => res.json())
        .then(() => { members = []; renderMembers(); })
        .catch(err => console.error('Error clearing members:', err));
}
    </script>
</body>
</html>
