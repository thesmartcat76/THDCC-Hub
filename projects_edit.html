<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Project Editor</title>
    <style>
        :root {
            --bg: #0b0b0c;
            --panel: #111214;
            --muted: #9aa6b2;
            --card: #121215;
            --accent: #2563eb;
            --accent-hover: #1e4fd8;
            --border: #222428;
            --text: #e6eef2;
            --input-bg: #0f1112;
        }

        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; background: var(--bg); color: var(--text); }
        a { color: #9ecbff; }
        .login-panel, .admin-panel { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-radius: 8px; color: var(--text); }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
        label { color: var(--muted); display:block; margin-top:8px; }
        button { padding: 10px 20px; background-color: var(--accent); color: white; border: none; cursor: pointer; border-radius: 6px; }
        button:hover { background-color: var(--accent-hover); }
        .project-item { background: var(--card); padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid rgba(255,255,255,0.02); }
        .project-item strong { display: block; margin-bottom: 4px; }
        .project-item .meta { color: var(--muted); font-size: 0.88em; margin-bottom: 6px; }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Admin Project Editor</h1>

    <div id="loginPanel" class="login-panel">
        <h2>Enter Password</h2>
        <input type="password" id="passwordInput" placeholder="Password">
        <button onclick="checkPassword()">Login</button>
    </div>

    <div id="adminPanel" class="admin-panel hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">Admin Panel</h2>
            <div>
                <a href="projects.html" style="background-color: #6c757d; color: white; padding: 10px 20px; text-decoration: none; border-radius: 3px; margin-right: 10px; display: inline-block;">← Back to Projects</a>
                <button onclick="logout()">Logout</button>
            </div>
        </div>

        <input type="text" id="projectName" placeholder="Project Name" required>
        <input type="date" id="projectDate">
        <textarea id="projectDesc" placeholder="Description"></textarea>
        <label for="projectLinks">Links (one per line)</label>
        <textarea id="projectLinks" placeholder="https://example.com"></textarea>
        <label for="projectMembers">Working Members (hold Ctrl/Cmd to select multiple)</label>
        <select id="projectMembers" multiple style="height: 120px;"></select>
        <label for="projectDeadline">Deadline</label>
        <input type="date" id="projectDeadline">

        <div style="display:flex; gap:10px; margin-top:10px;">
            <button id="saveBtn" onclick="saveProject()">Add Project</button>
            <button id="cancelBtn" onclick="resetForm()" style="background:#6c757d; display:none;">Cancel Edit</button>
        </div>

        <h2>Projects</h2>
        <div id="projectsList"></div>

        <h2>Export / Import</h2>
        <div style="margin-bottom: 15px;">
            <label for="fileUpload">Upload JSON File:</label>
            <input type="file" id="fileUpload" accept=".json">
            <button onclick="uploadJSON()">Upload Projects</button>
        </div>
        <div style="display:flex; gap:10px;">
            <button onclick="downloadJSON()">Download JSON</button>
            <button onclick="clearAll()" style="background:#dc3545;">Clear All</button>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'THDCC2026';
        let projects = [];
        let editIndex = -1;

        function checkPassword() {
            const pwd = document.getElementById('passwordInput').value;
            if (pwd === ADMIN_PASSWORD) {
                document.getElementById('loginPanel').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadProjects();
                loadMembers();
            } else {
                alert('Invalid password');
            }
        }

        function logout() {
            document.getElementById('loginPanel').classList.remove('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('passwordInput').value = '';
        }

        function loadProjects() {
            fetch('api.php?action=get&type=projects')
                .then(res => res.json())
                .then(data => { projects = data; renderProjects(); })
                .catch(err => console.error('Error loading projects:', err));
        }

        function loadMembers() {
            fetch('api.php?action=get&type=members')
                .then(res => res.json())
                .then(members => {
                    const sel = document.getElementById('projectMembers');
                    sel.innerHTML = members.map(m =>
                        `<option value="${m.name}">${m.name}${m.uid ? ' (' + m.uid + ')' : ''}</option>`
                    ).join('');
                })
                .catch(err => console.error('Error loading members:', err));
        }

        function saveProject() {
            const name     = document.getElementById('projectName').value.trim();
            const date     = document.getElementById('projectDate').value;
            const desc     = document.getElementById('projectDesc').value.trim();
            const deadline = document.getElementById('projectDeadline').value;
            const linksRaw = document.getElementById('projectLinks').value.trim();
            const links    = linksRaw ? linksRaw.split(/\r?\n|,/).map(s => s.trim()).filter(Boolean) : [];
            const sel      = document.getElementById('projectMembers');
            const members  = Array.from(sel.selectedOptions).map(o => o.value);

            if (!name) { alert('Project name is required'); return; }

            if (editIndex > -1) {
                // Editing: update the local array then upload the whole set
                projects[editIndex] = { name, date, desc, members, deadline, links };
                fetch('api.php?action=upload&type=projects', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessions: projects })
                })
                .then(res => res.json())
                .then(data => { projects = data.items; renderProjects(); resetForm(); })
                .catch(err => console.error('Error updating project:', err));
            } else {
                // Adding new
                fetch('api.php?action=add&type=projects', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, date, desc, members, deadline, links })
                })
                .then(res => res.json())
                .then(data => { projects = data.items; renderProjects(); resetForm(); })
                .catch(err => console.error('Error adding project:', err));
            }
        }

        // Keep old name working (button calls addProject)
        function addProject() { saveProject(); }

        function startEdit(index) {
            editIndex = index;
            const p = projects[index];
            document.getElementById('projectName').value     = p.name || '';
            document.getElementById('projectDate').value     = p.date || '';
            document.getElementById('projectDesc').value     = p.desc || '';
            document.getElementById('projectDeadline').value = p.deadline || '';
            document.getElementById('projectLinks').value    = (p.links || []).join('\n');
            const sel = document.getElementById('projectMembers');
            Array.from(sel.options).forEach(opt => {
                opt.selected = p.members && p.members.includes(opt.value);
            });
            document.getElementById('saveBtn').textContent = 'Update Project';
            document.getElementById('cancelBtn').style.display = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            editIndex = -1;
            document.getElementById('projectName').value     = '';
            document.getElementById('projectDate').value     = '';
            document.getElementById('projectDesc').value     = '';
            document.getElementById('projectDeadline').value = '';
            document.getElementById('projectLinks').value    = '';
            document.getElementById('projectMembers').selectedIndex = -1;
            document.getElementById('saveBtn').textContent = 'Add Project';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        function deleteProject(index) {
            if (!confirm('Delete this project?')) return;
            fetch('api.php?action=delete&type=projects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ index })
            })
            .then(res => res.json())
            .then(data => { projects = data.items; renderProjects(); })
            .catch(err => console.error('Error deleting project:', err));
        }

        function renderProjects() {
            const list = document.getElementById('projectsList');
            if (!projects.length) { list.innerHTML = '<p style="color:var(--muted)">No projects yet.</p>'; return; }
            list.innerHTML = projects.map((p, i) => `
                <div class="project-item">
                    <strong>${p.name}</strong>
                    <div class="meta">
                        ${p.date ? '📅 ' + p.date : ''}
                        ${p.deadline ? ' · Due: ' + p.deadline : ''}
                    </div>
                    <div class="meta">Members: ${Array.isArray(p.members) && p.members.length ? p.members.join(', ') : 'None'}</div>
                    ${p.desc ? `<div style="font-size:0.9em; margin:4px 0;">${p.desc}</div>` : ''}
                    <div class="btn-row">
                        <button onclick="startEdit(${i})">Edit</button>
                        <button onclick="deleteProject(${i})" style="background:#dc3545;">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function downloadJSON() {
            const blob = new Blob([JSON.stringify(projects, null, 2)], { type: 'application/json' });
            const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'projects.json' });
            a.click();
        }

        function uploadJSON() {
            const file = document.getElementById('fileUpload').files[0];
            if (!file) { alert('Please select a JSON file'); return; }
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!Array.isArray(data)) { alert('File must contain an array of projects.'); return; }
                    if (!data.every(p => p.name)) { alert('Each project must have a name.'); return; }
                    fetch('api.php?action=upload&type=projects', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessions: data })
                    })
                    .then(res => res.json())
                    .then(d => { projects = d.items; renderProjects(); document.getElementById('fileUpload').value = ''; alert('Projects uploaded!'); })
                    .catch(err => { console.error(err); alert('Upload error'); });
                } catch { alert('Invalid JSON file'); }
            };
            reader.readAsText(file);
        }

        function clearAll() {
            if (!confirm('Clear ALL projects? This cannot be undone.')) return;
            fetch('api.php?action=clear&type=projects', { method: 'POST' })
                .then(res => res.json())
                .then(() => { projects = []; renderProjects(); })
                .catch(err => console.error('Error clearing projects:', err));
        }
    </script>
</body>
</html>
